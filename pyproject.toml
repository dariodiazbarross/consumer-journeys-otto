[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-journeys-otto"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.5.5", "pyarrow==23.0.1", "orjson==3.12.0",
  "numpy==2.5.2", "pandas==2.3.3", "scipy==1.18.1",
  "matplotlib==3.11.1", "seaborn==0.13.2", "psutil==7.2.2"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
